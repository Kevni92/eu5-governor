name: Generate EU5 Governor GUI overrides

on:
  push:
    paths:
      - '.github/workflows/generate-eu5gov-gui-overrides.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate patched vanilla GUI files
        run: |
          python - <<'PY'
          import tools.generate_eu5gov_gui_overrides as generator

          original_patch_outliner = generator.patch_outliner

          def patch_outliner(source: str) -> str:
              source = original_patch_outliner(source)
              bad = '\t' * 11 + 'eu5gov_governor_outliner_section = {}\n' + '\t' * 10 + '}\n'
              good = '\t' * 10 + '}\n\n' + '\t' * 10 + 'eu5gov_governor_outliner_section = {}\n'
              if source.count(bad) != 1:
                  raise RuntimeError("Could not relocate Governor section outside native entries hbox")
              return source.replace(bad, good, 1)

          def patch_character_lateralview(source: str) -> str:
              role_line = '\t' * 9 + 'text = "[CharacterRoleMask.GetRolesName]"'
              if source.count(role_line) != 1:
                  raise RuntimeError("Could not uniquely locate active CharacterRoleMask role text")

              role_pos = source.index(role_line)
              widget_marker = '\t' * 8 + 'text_single = {'
              block_start = source.rfind(widget_marker, 0, role_pos)
              if block_start < 0:
                  raise RuntimeError("Could not locate active role text widget start")

              open_brace = source.index('{', block_start)
              depth = 0
              block_end = None
              for idx in range(open_brace, len(source)):
                  char = source[idx]
                  if char == '{':
                      depth += 1
                  elif char == '}':
                      depth -= 1
                      if depth == 0:
                          block_end = idx + 1
                          break
              if block_end is None:
                  raise RuntimeError("Could not locate active role text widget end")

              vanilla_block = source[block_start:block_end]
              vanilla_block = vanilla_block.replace(
                  role_line,
                  '\t' * 9 + 'visible = "[Not(CharacterLateralview.GetCharacter.MakeScope.GetVariable(\'eu5gov_governorship\').IsSet)]"\n' + role_line,
                  1,
              )

              governor_block = (
                  '\n' + '\t' * 8 + 'text_single = {\n'
                  + '\t' * 9 + 'minimumsize = { -1 20 }\n'
                  + '\t' * 9 + 'autoresize = yes\n'
                  + '\t' * 9 + 'visible = "[CharacterLateralview.GetCharacter.MakeScope.GetVariable(\'eu5gov_governorship\').IsSet]"\n'
                  + '\t' * 9 + 'text = "EU5GOV_CHARACTER_ROLE_GOVERNOR"\n'
                  + '\t' * 9 + 'tooltip = "EU5GOV_CHARACTER_ROLE_GOVERNOR_TT"\n'
                  + '\t' * 8 + '}'
              )
              return source[:block_start] + vanilla_block + governor_block + source[block_end:]

          generator.patch_outliner = patch_outliner
          generator.patch_character_lateralview = patch_character_lateralview
          generator.main()
          PY

      - name: Commit generated GUI overrides
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add in_game/gui/outliner.gui in_game/gui/character_lateralview.gui
          if git diff --cached --quiet; then
            echo "Generated GUI overrides are already current."
            exit 0
          fi
          git commit -m "Integrate governors into native EU5 UI"
          git push
