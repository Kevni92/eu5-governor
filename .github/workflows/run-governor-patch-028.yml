name: Run Governor Patch 0.2.8

on:
  push:
    paths:
      - '.github/workflows/run-governor-patch-028.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch_governor_028.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add in_game/common/generic_actions/eu5gov_governor_outliner_actions.txt \
                  in_game/common/generic_action_ai_lists/eu5gov_governor_actions.txt \
                  in_game/gui/outliner.gui \
                  main_menu/localization/german/zz_eu5gov_l_german.yml \
                  main_menu/localization/english/zz_eu5gov_l_english.yml \
                  .metadata/metadata.json CHANGELOG.md
          git diff --cached --check
          git commit -m "Fix governor role actions and entrenchment UI"
          git push
