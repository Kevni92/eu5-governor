name: Run Governor Patch 0.2.7

on:
  push:
    paths:
      - '.github/workflows/run-governor-patch-027.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_governor_027.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add in_game/common/scripted_effects/eu5gov_governor_effects.txt in_game/gui/outliner.gui
          git commit -m "Polish governor outliner and dismissal floor"
          git push
