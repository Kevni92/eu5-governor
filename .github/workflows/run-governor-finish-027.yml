name: Finish Governor Patch 0.2.7

on:
  push:
    paths:
      - '.github/workflows/run-governor-finish-027.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply localization and release patch
        run: python .github/scripts/finish_governor_027.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .metadata CHANGELOG.md main_menu/localization
          git commit -m "Localize governor concepts and modifiers"
          git push
