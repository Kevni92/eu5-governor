name: Generate Governor Outliner

on:
  push:
    paths:
      - '.github/workflows/generate-governor-outliner.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate EU5 1.3 governor outliner override
        shell: bash
        run: |
          mkdir -p in_game/gui
          curl -fsSL 'https://raw.githubusercontent.com/HLJSXK/eu5-towards-victory/879fb81040a873a5eeb9a9a034621fc6572571e5/reference_game_files/game/in_game/gui/outliner.gui' -o in_game/gui/outliner.gui
          python3 - <<'PY'
          from pathlib import Path

          path = Path('in_game/gui/outliner.gui')
          text = path.read_text(encoding='utf-8-sig')

          types_block = r'''

# Character Governors: custom outliner category and direct management context menu.
types EU5GovOutlinerTypes
{
    type EU5GovGovernorContextMenu = ContextMenuBase {
        blockoverride "contextmenu_content" {
            ContextMenuSection = {
                blockoverride "title_icon" {
                    icon = {
                        size = { 24 24 }
                        texture = "gfx/interface/icons/character_roles/regent.dds"
                    }
                }
                blockoverride "title_text" {
                    raw_text = "[Character.GetName]"
                }
                blockoverride "contextmenu_entries" {
                    ContextMenuEntry = {
                        blockoverride "click_action" {
                            title = "EU5GOV_SET_NORMAL_GOVERNOR"
                            on_action = "[GetScriptedGui('eu5gov_set_role_normal').Execute(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('governor', Character.MakeScope).End)]"
                        }
                        blockoverride "entry_text" { text = "EU5GOV_SET_NORMAL_GOVERNOR" }
                    }
                    ContextMenuEntry = {
                        blockoverride "click_action" {
                            title = "EU5GOV_SET_INTEGRATION_GOVERNOR"
                            on_action = "[GetScriptedGui('eu5gov_set_role_integration').Execute(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('governor', Character.MakeScope).End)]"
                        }
                        blockoverride "entry_text" { text = "EU5GOV_SET_INTEGRATION_GOVERNOR" }
                    }
                    ContextMenuEntry = {
                        blockoverride "click_action" {
                            title = "EU5GOV_SET_COLONIAL_GOVERNOR"
                            on_action = "[GetScriptedGui('eu5gov_set_role_colonial').Execute(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('governor', Character.MakeScope).End)]"
                        }
                        blockoverride "entry_text" { text = "EU5GOV_SET_COLONIAL_GOVERNOR" }
                    }
                    ContextMenuEntry = {
                        blockoverride "click_action" {
                            title = "eu5gov_dismiss_governor"
                            on_action = "[GetScriptedGui('eu5gov_dismiss_governor_sgui').Execute(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('governor', Character.MakeScope).End)]"
                        }
                        blockoverride "entry_text" { text = "eu5gov_dismiss_governor" }
                    }
                }
            }
        }
    }

    type EU5GovGovernorOutlinerBlock = vbox {
        visible = "[And(Outliner.IsExpanded, GreaterThan_int32(GetDataModelSize(GetPlayer.MakeScope.GetMapKeys('eu5gov_governor_roster')), '(int32)0'))]"
        layoutpolicy_horizontal = expanding
        maximumsize = { 405 -1 }
        minimumsize = { 405 -1 }
        margin_bottom = 4
        spacing = 1

        button = {
            size = { 405 30 }
            using = button_common_template
            background = {
                texture = "gfx/interface/buttons/outliner/outliner_category_button.dds"
                texture_density = 2
                spriteType = corneredstretched
                spriteborder = { 50 0 }
                frame_grid = { 4 1 }
            }
            onclick = "[GetVariableSystem.Toggle('eu5gov_governor_outliner_collapsed')]"
            tooltip = "EU5GOV_OUTLINER_HEADER_TT"

            hbox = {
                margin_left = 10
                margin_right = 10
                spacing = 6

                icon = {
                    size = { 20 20 }
                    texture = "gfx/interface/icons/character_roles/regent.dds"
                }
                text_single = {
                    autoresize = yes
                    text = "EU5GOV_OUTLINER_GOVERNORS"
                    default_format = "#T"
                }
                expand = {}
                text_single = {
                    autoresize = yes
                    raw_text = "[GetDataModelSize(GetPlayer.MakeScope.GetMapKeys('eu5gov_governor_roster'))]"
                }
                text_single = {
                    autoresize = yes
                    text = "[SelectLocalization(GetVariableSystem.Exists('eu5gov_governor_outliner_collapsed'), 'EU5GOV_OUTLINER_EXPAND_MARK', 'EU5GOV_OUTLINER_COLLAPSE_MARK')]"
                }
            }
        }

        vbox = {
            visible = "[Not(GetVariableSystem.Exists('eu5gov_governor_outliner_collapsed'))]"
            layoutpolicy_horizontal = expanding
            datamodel = "[GetPlayer.MakeScope.GetMapKeys('eu5gov_governor_roster')]"

            item = {
                button = {
                    datacontext = "[Scope.GetCharacter]"
                    size = { 405 46 }
                    using = button_common_template
                    background = {
                        texture = "gfx/interface/buttons/paper_outliner_button.dds"
                        texture_density = 2
                        spriteType = corneredstretched
                        spriteborder = { 30 0 }
                        frame_grid = { 4 1 }
                        alpha = 0.85
                    }

                    action_tooltip = {
                        click_type = left
                        click_mode = single
                        title = "CHARACTER_CLICK_TOOLTIP_LEFT_CLICK"
                        on_action = "[ShowCharacter(Character.Self)]"
                    }
                    action_tooltip = {
                        click_type = right
                        click_mode = single
                        cursor = "country_menu"
                        title = "EU5GOV_OUTLINER_RIGHT_CLICK_TT"
                        on_action = "[PdxGuiWidget.ToggleContextMenu]"
                    }
                    contextmenu_enabled = yes
                    contextmenu_widget = { EU5GovGovernorContextMenu = {} }
                    tooltip = "EU5GOV_OUTLINER_ROW_TT"

                    hbox = {
                        margin_left = 10
                        margin_right = 10
                        spacing = 8

                        icon = {
                            size = { 22 22 }
                            texture = "gfx/interface/icons/character_roles/regent.dds"
                        }

                        vbox = {
                            layoutpolicy_horizontal = expanding
                            hbox = {
                                layoutpolicy_horizontal = expanding
                                text_single = {
                                    maximumsize = { 210 20 }
                                    autoresize = yes
                                    text = "[Character.GetName]"
                                    default_format = "#L"
                                }
                                expand = {}
                                text_single = {
                                    autoresize = yes
                                    text = "EU5GOV_ENTRENCHMENT_SHORT"
                                }
                                text_single = {
                                    autoresize = yes
                                    raw_text = "[Character.MakeScope.GetVariable('eu5gov_entrenchment').GetValue|0]/100"
                                    default_format = "#Y"
                                }
                            }

                            hbox = {
                                layoutpolicy_horizontal = expanding
                                text_single = {
                                    maximumsize = { 205 18 }
                                    autoresize = yes
                                    text = "[GetPlayer.MakeScope.GetVariableFromVariableMap('eu5gov_governor_roster', Character.MakeScope).GetLocation.GetName]"
                                }
                                expand = {}
                                text_single = {
                                    autoresize = yes
                                    visible = "[EqualTo_CFixedPoint(Character.MakeScope.GetVariable('eu5gov_governor_role').GetValue, '(CFixedPoint)1')]"
                                    text = "EU5GOV_ROLE_NORMAL"
                                    default_format = "#G"
                                }
                                text_single = {
                                    autoresize = yes
                                    visible = "[EqualTo_CFixedPoint(Character.MakeScope.GetVariable('eu5gov_governor_role').GetValue, '(CFixedPoint)2')]"
                                    text = "EU5GOV_ROLE_INTEGRATION"
                                    default_format = "#Y"
                                }
                                text_single = {
                                    autoresize = yes
                                    visible = "[EqualTo_CFixedPoint(Character.MakeScope.GetVariable('eu5gov_governor_role').GetValue, '(CFixedPoint)3')]"
                                    text = "EU5GOV_ROLE_COLONIAL"
                                    default_format = "#P"
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}
'''

          marker = '\nwindow = {'
          if marker not in text:
              raise SystemExit('Could not find outliner window marker')
          text = text.replace(marker, types_block + marker, 1)

          scroll_marker = '''\t\tvbox = {\n\t\t\tmargin_right = 8\n\t\t\thbox = {'''
          replacement = '''\t\tvbox = {\n\t\t\tmargin_right = 8\n\n\t\t\tEU5GovGovernorOutlinerBlock = {}\n\n\t\t\thbox = {'''
          if scroll_marker not in text:
              raise SystemExit('Could not find outliner scroll insertion point')
          text = text.replace(scroll_marker, replacement, 1)

          path.write_text('\ufeff' + text, encoding='utf-8')
          PY

      - name: Commit generated outliner override
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add in_game/gui/outliner.gui
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add governor outliner UI'
          git push
