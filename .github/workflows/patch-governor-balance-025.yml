name: Patch Governor Balance 0.2.5

on:
  push:
    paths:
      - '.github/workflows/patch-governor-balance-025.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply balance changes
        shell: python
        run: |
          from pathlib import Path
          import re, json

          def read(path):
              return Path(path).read_text(encoding='utf-8-sig')

          def write(path, text):
              Path(path).write_text('\ufeff' + text, encoding='utf-8') if path.endswith(('.txt','.yml','.json')) else Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          # Governor building: 30 base Proximity Source.
          p = 'in_game/common/building_types/zz_eu5gov_governor_buildings.txt'
          t = read(p)
          t = t.replace('local_proximity_source = 50', 'local_proximity_source = 30')
          write(p, t)

          # Governor contribution: ADM only, 100 ADM = +50 Proximity Source.
          p = 'in_game/common/scripted_effects/eu5gov_governor_effects.txt'
          t = read(p)
          old = '''\t\t\tsize = {\n\t\t\t\tvalue = var:eu5gov_governor.adm\n\t\t\t\tmultiply = 0.25\n\t\t\t\tadd = {\n\t\t\t\t\tvalue = var:eu5gov_governor.dip\n\t\t\t\t\tmultiply = 0.05\n\t\t\t\t}\n\t\t\t\tadd = {\n\t\t\t\t\tvalue = var:eu5gov_governor.mil\n\t\t\t\t\tmultiply = 0.05\n\t\t\t\t}\n\t\t\t}\n'''
          new = '''\t\t\tsize = {\n\t\t\t\tvalue = var:eu5gov_governor.adm\n\t\t\t\tmultiply = 0.50\n\t\t\t}\n'''
          t = replace_once(t, old, new, 'proximity formula')
          t = t.replace("# Governor's Estate loses up to 25 percentage points of satisfaction and the\n# country loses up to 10 Legitimacy, linearly scaled by Entrenchment/Machtbasis.", "# Governor's Estate loses up to 100 percentage points of satisfaction and the\n# country loses up to 50 Stability, linearly scaled by Entrenchment.")
          t = replace_once(t, '\t\t\t\t\t\tmultiply = -0.0025\n', '\t\t\t\t\t\tmultiply = -0.01\n', 'dismiss satisfaction scaling')
          old = '''\t\t\t\tadd_legitimacy = {\n\t\t\t\t\tvalue = scope:eu5gov_dismissed_governor.var:eu5gov_entrenchment\n\t\t\t\t\tmultiply = -0.10\n\t\t\t\t}\n'''
          new = '''\t\t\t\tadd_stability = {\n\t\t\t\t\tvalue = scope:eu5gov_dismissed_governor.var:eu5gov_entrenchment\n\t\t\t\t\tmultiply = -0.50\n\t\t\t\t}\n'''
          t = replace_once(t, old, new, 'dismiss stability scaling')
          write(p, t)

          # Colonial Governor: light population growth in addition to migration attraction.
          p = 'main_menu/common/static_modifiers/eu5gov_governor_modifiers.txt'
          t = read(p)
          t = replace_once(t, '\tlocal_migration_attraction = 0.25\n}', '\tlocal_migration_attraction = 0.25\n\tlocal_population_growth = 0.001\n}', 'colonial population growth')
          t = t.replace('Governor Machtbasis', 'Governor Entrenchment').replace('100 Machtbasis', '100 Entrenchment')
          write(p, t)

          # English localization.
          p = 'main_menu/localization/english/zz_eu5gov_l_english.yml'
          t = read(p)
          t = t.replace('base Proximity Source of #G 50#!', 'base Proximity Source of #G 30#!')
          t = replace_once(t,
              ' eu5gov_governor_administration_desc: "The appointed Governor strengthens this location as a Proximity Source. Each point of @adm![adm|E] contributes #G +0.25#! Proximity Source; each point of @dip![dip|E] and @mil![mil|E] contributes #G +0.05#!."',
              ' eu5gov_governor_administration_desc: "The appointed Governor strengthens this location as a Proximity Source. Each point of @adm![adm|E] contributes #G +0.50#! Proximity Source. A Governor with 100 ADM therefore adds #G +50#! to the Residence base of 30, for a total of #G 80#!."',
              'english governor proximity loc')
          t = t.replace('grants #G +0.25#! local migration attraction."', 'grants #G +0.25#! local migration attraction and #G +0.001#! local population growth."')
          t = t.replace("Non-Crown Governors cost Estate Satisfaction and Legitimacy in proportion to Entrenchment: at 100 Entrenchment the Governor's Estate loses 25 percentage points of Satisfaction and the country loses 10 Legitimacy.", "Non-Crown Governors cost Estate Satisfaction and Stability in proportion to Entrenchment: at 100 Entrenchment the Governor's Estate loses 100 percentage points of Satisfaction and the country loses 50 Stability.")
          t = t.replace("their Estate loses #R 25 percentage points#! of Satisfaction and the country loses #R 10 Legitimacy#!", "their Estate loses #R 100 percentage points#! of Satisfaction and the country loses #R 50 Stability#!")
          t = t.replace('grants #G +0.25#! local migration attraction. The currently active role cannot be selected again.', 'grants #G +0.25#! local migration attraction and #G +0.001#! local population growth. The currently active role cannot be selected again.')
          write(p, t)

          # German localization: Entrenchment -> Verankerung.
          p = 'main_menu/localization/german/zz_eu5gov_l_german.yml'
          t = read(p)
          t = t.replace('grundlegende Nähequelle von #G 50#!', 'grundlegende Nähequelle von #G 30#!')
          t = replace_once(t,
              ' eu5gov_governor_administration_desc: "Der ernannte Gouverneur stärkt diesen Ort als Nähequelle. Jeder Punkt @adm![adm|E] gewährt #G +0,25#! Nähequelle; jeder Punkt @dip![dip|E] und @mil![mil|E] gewährt #G +0,05#!."',
              ' eu5gov_governor_administration_desc: "Der ernannte Gouverneur stärkt diesen Ort als Nähequelle. Jeder Punkt @adm![adm|E] gewährt #G +0,50#! Nähequelle. Ein Gouverneur mit 100 ADM ergänzt die Grundnähequelle von 30 damit um #G +50#! auf insgesamt #G 80#!."',
              'german governor proximity loc')
          t = t.replace('gewährt #G +0,25#! lokale Migrationsattraktivität."', 'gewährt #G +0,25#! lokale Migrationsattraktivität und #G +0,001#! lokales Bevölkerungswachstum."')
          t = t.replace('gewährt #G +0,25#! lokale Migrationsattraktivität. Die bereits aktive Amtsausrichtung', 'gewährt #G +0,25#! lokale Migrationsattraktivität und #G +0,001#! lokales Bevölkerungswachstum. Die bereits aktive Amtsausrichtung')
          t = t.replace('Bei 100 Machtbasis verliert sein Stand 25 Prozentpunkte Zufriedenheit und das Land 10 Legitimität.', 'Bei 100 Verankerung verliert sein Stand 100 Prozentpunkte Zufriedenheit und das Land 50 Stabilität.')
          t = t.replace('Bei 100 verliert sein Stand #R 25 Prozentpunkte Zufriedenheit#! und das Land #R 10 Legitimität#!.', 'Bei 100 verliert sein Stand #R 100 Prozentpunkte Zufriedenheit#! und das Land #R 50 Stabilität#!.')
          t = t.replace('Machtbasis', 'Verankerung')
          write(p, t)

          # Metadata version.
          p = '.metadata/metadata.json'
          t = read(p)
          t = replace_once(t, '"version": "0.2.4"', '"version": "0.2.5"', 'metadata version')
          write(p, t)

          # Changelog.
          p = 'CHANGELOG.md'
          t = Path(p).read_text(encoding='utf-8')
          entry = '''## 0.2.5\n\n- Reduced Governor's Residence base Proximity Source from 50 to 30.\n- Governor Proximity contribution now scales only from ADM at `ADM × 0.50`; 100 ADM adds +50 for a maximum Residence total of 80.\n- Voluntary dismissal/replacement of a non-Crown Governor now scales up to -100 percentage points Estate Satisfaction and -50 Stability at 100 Entrenchment; 50 Entrenchment costs half.\n- Crown Governors remain free to dismiss or replace.\n- German `Machtbasis` terminology renamed to `Verankerung`; English remains `Entrenchment`.\n- Colonial Governors now also grant +0.001 local population growth in addition to migration attraction.\n\n'''
          t = t.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          Path(p).write_text(t, encoding='utf-8')

          # README / Workshop headline values and formula references.
          for p in ['README.md', 'WORKSHOP.md']:
              t = Path(p).read_text(encoding='utf-8')
              t = t.replace('50 base Proximity Source', '30 base Proximity Source')
              t = t.replace('**50 Proximity Source**', '**30 Proximity Source**')
              t = t.replace('`ADM × 0.25 + DIP × 0.05 + MIL × 0.05`', '`ADM × 0.50`')
              t = t.replace('A 50/50/50 character contributes +17.5; a 100/100/100 character contributes +35.', 'A Governor with 50 ADM contributes +25; 100 ADM contributes +50, producing 80 total Proximity Source with the Residence base.')
              t = t.replace('Entrenchment-scaled dismissal costs: at 100, a non-Crown Governor costs 25 percentage points of their Estate Satisfaction and 10 Legitimacy; Crown Governors are free.', 'Entrenchment-scaled dismissal costs: at 100, a non-Crown Governor costs 100 percentage points of their Estate Satisfaction and 50 Stability; at 50 the cost is half. Crown Governors are free.')
              t = t.replace('+0.25 local migration attraction.', '+0.25 local migration attraction and +0.001 local population growth.')
              Path(p).write_text(t, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .metadata CHANGELOG.md README.md WORKSHOP.md in_game main_menu
          git commit -m "Rebalance governor entrenchment and proximity"
          git push
