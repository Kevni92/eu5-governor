name: Run Governor Text Cleanup 0.2.11

on:
  push:
    paths:
      - '.github/scripts/cleanup_governor_0211_text.py'
      - '.github/workflows/run-governor-text-cleanup-0211.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply text cleanup
        run: python .github/scripts/cleanup_governor_0211_text.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Polish governor dismissal wording"
            git push origin HEAD:main
          fi
