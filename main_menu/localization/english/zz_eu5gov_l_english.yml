l_english:
 local_governor: "Governor's Residence"
 local_governor_desc: "A permanent provincial administration that projects the authority of the central government. The residence provides a base Proximity Source of #G 30#!. Appointing a Governor adds a further bonus based primarily on the character's Administrative ability."
 naval_governor: "Naval Governor (Legacy)"
 naval_governor_desc: "Maritime and land governorships are unified by Character Governors. Existing Naval Governor capacity is used by Governor's Residences instead."

 eu5gov_governor_capacity_tt: "The number of Governor's Residences must be lower than the combined #Y Local Governor#! and #Y Naval Governor#! capacity, after any Lieutenancies using that capacity."
 eu5gov_governor_administration: "Governor's Administration"
 eu5gov_governor_administration_desc: "The appointed Governor strengthens this location as a Proximity Source. Each point of @adm![adm|E] contributes #G +0.50#! Proximity Source. A Governor with 100 ADM therefore adds #G +50#! to the Residence base of 30, for a total of #G 80#!."
 eu5gov_integration_governor: "Integration Governor"
 eu5gov_integration_governor_desc: "This Governor is tasked with binding a culturally distinct territory more closely to the state and grants #G +25%#! local assimilation speed."
 eu5gov_colonial_governor: "Colonial Governor"
 eu5gov_colonial_governor_desc: "This Governor is tasked with developing an overseas possession and grants #G +0.25#! local migration attraction and #G +0.001#! local population growth."

 STATIC_MODIFIER_NAME_eu5gov_governor_administration: "Governor Administration"
 STATIC_MODIFIER_DESC_eu5gov_governor_administration: "The displayed #G +1.00#! is the base unit of this scalable modifier. The actual Proximity Source equals #Y Governor ADM × 0.50#!. Example: 55 ADM gives #G +27.50#! Proximity Source; together with the Residence's #G +30#! that is #G 57.50#!."
 STATIC_MODIFIER_NAME_eu5gov_integration_governor: "Integration Administration"
 STATIC_MODIFIER_DESC_eu5gov_integration_governor: "The Integration Governor accelerates local cultural assimilation."
 STATIC_MODIFIER_NAME_eu5gov_colonial_governor: "Colonial Administration"
 STATIC_MODIFIER_DESC_eu5gov_colonial_governor: "The Colonial Governor promotes migration and population growth at the Governor seat."
 STATIC_MODIFIER_NAME_eu5gov_governor_crown_estate_power: "Governor Influence: Crown"
 STATIC_MODIFIER_NAME_eu5gov_governor_nobles_estate_power: "Governor Influence: Nobility"
 STATIC_MODIFIER_NAME_eu5gov_governor_clergy_estate_power: "Governor Influence: Clergy"
 STATIC_MODIFIER_NAME_eu5gov_governor_burghers_estate_power: "Governor Influence: Burghers"
 STATIC_MODIFIER_NAME_eu5gov_governor_peasants_estate_power: "Governor Influence: Peasants"
 STATIC_MODIFIER_NAME_eu5gov_governor_tribes_estate_power: "Governor Influence: Tribes"
 STATIC_MODIFIER_NAME_eu5gov_governor_cossacks_estate_power: "Governor Influence: Cossacks"
 STATIC_MODIFIER_NAME_eu5gov_governor_dhimmi_estate_power: "Governor Influence: Dhimmi"

 eu5gov_governor_crown_estate_power: "Governor Influence: Crown"
 eu5gov_governor_crown_estate_power_desc: "Serving Crown Governors increase Crown Estate power by half their combined Entrenchment."
 eu5gov_governor_nobles_estate_power: "Governor Influence: Nobility"
 eu5gov_governor_nobles_estate_power_desc: "Serving Noble Governors increase Nobility Estate power by half their combined Entrenchment."
 eu5gov_governor_clergy_estate_power: "Governor Influence: Clergy"
 eu5gov_governor_clergy_estate_power_desc: "Serving Clergy Governors increase Clergy Estate power by half their combined Entrenchment."
 eu5gov_governor_burghers_estate_power: "Governor Influence: Burghers"
 eu5gov_governor_burghers_estate_power_desc: "Serving Burgher Governors increase Burghers Estate power by half their combined Entrenchment."
 eu5gov_governor_peasants_estate_power: "Governor Influence: Peasants"
 eu5gov_governor_peasants_estate_power_desc: "Serving Peasant Governors increase Peasants Estate power by half their combined Entrenchment."
 eu5gov_governor_tribes_estate_power: "Governor Influence: Tribes"
 eu5gov_governor_tribes_estate_power_desc: "Serving Tribal Governors increase Tribes Estate power by half their combined Entrenchment."
 eu5gov_governor_cossacks_estate_power: "Governor Influence: Cossacks"
 eu5gov_governor_cossacks_estate_power_desc: "Serving Cossack Governors increase Cossacks Estate power by half their combined Entrenchment."
 eu5gov_governor_dhimmi_estate_power: "Governor Influence: Dhimmi"
 eu5gov_governor_dhimmi_estate_power_desc: "Serving Dhimmi Governors increase Dhimmi Estate power by half their combined Entrenchment."

 eu5gov_appoint_governor: "Appoint Governor"
 eu5gov_appoint_governor_concept: "Governor"
 eu5gov_appoint_governor_act: "$eu5gov_appoint_governor$"
 eu5gov_appoint_governor_desc_specific: "Appoint an eligible character to administer one vacant Governor's Residence."
 eu5gov_appoint_governor_desc: "Choose an eligible character and a vacant Governor's Residence. A newly appointed Governor starts as a Normal Governor. Their role can then be changed from the Governors outliner by right-clicking their entry."
 eu5gov_appoint_governor_past: "A Governor was appointed"
 eu5gov_appoint_governor_act_past: "[SCOPE.sCharacter('recipient').GetName] was appointed Governor at [SCOPE.sLocation('target').GetName]."

 eu5gov_appoint_governor_at_residence: "Appoint Governor"
 eu5gov_appoint_governor_at_residence_concept: "Governor"
 eu5gov_appoint_governor_at_residence_act: "$eu5gov_appoint_governor_at_residence$"
 eu5gov_appoint_governor_at_residence_desc_specific: "Choose a Governor for this vacant Governor's Residence."
 eu5gov_appoint_governor_at_residence_desc: "Select an eligible character for the Governor's Residence clicked in the Governors outliner. Governor eligibility follows Cabinet legal restrictions, including gender and Estate access, while Governors must also be free from another major office or command."
 eu5gov_appoint_governor_at_residence_past: "A Governor was appointed"
 eu5gov_appoint_governor_at_residence_act_past: "[SCOPE.sCharacter('recipient').GetName] was appointed Governor."

 eu5gov_change_governor_at_residence: "Change Governor"
 eu5gov_change_governor_at_residence_concept: "Governor"
 eu5gov_change_governor_at_residence_act: "$eu5gov_change_governor_at_residence$"
 eu5gov_change_governor_at_residence_desc_specific: "Replace the current Governor of this Governor's Residence."
 eu5gov_change_governor_at_residence_desc: "Choose a new eligible Governor for the office clicked in the Governors outliner. Replacing the current office holder counts as a voluntary dismissal and therefore pays the outgoing Governor's Entrenchment-scaled political cost unless they belong to the Crown Estate."
 eu5gov_change_governor_at_residence_past: "A Governor was replaced"
 eu5gov_change_governor_at_residence_act_past: "[SCOPE.sCharacter('recipient').GetName] became the new Governor."

 eu5gov_dismiss_governor: "Dismiss Governor"
 eu5gov_dismiss_governor_concept: "Governor"
 eu5gov_dismiss_governor_act: "$eu5gov_dismiss_governor$"
 eu5gov_dismiss_governor_desc_specific: "Dismiss an appointed Governor and leave the residence vacant."
 eu5gov_dismiss_governor_desc: "Remove a Governor from office. Non-Crown Governors always cost at least #R -10 Estate Satisfaction#! and #R -5 Stability#!. Above 10 Entrenchment the cost scales linearly: 50 Entrenchment costs -50 Satisfaction and -25 Stability; 100 Entrenchment costs -100 Satisfaction and -50 Stability. Crown Governors are free to dismiss."
 eu5gov_dismiss_governor_past: "A Governor was dismissed"
 eu5gov_dismiss_governor_act_past: "[SCOPE.sCharacter('recipient').GetName] was dismissed from the governorship."

 eu5gov_select_governor_character: "Select a Governor"
 eu5gov_select_replacement_governor: "Select a New Governor"
 eu5gov_no_governor_character_available: "No eligible character is available. Governor candidates follow the country's Cabinet legal restrictions for gender and Estate access, must be adult and loyal, and must be free from another major office, military command, exploration or governorship."
 eu5gov_select_governor_residence: "Select a Governor's Residence"
 eu5gov_no_governor_residence_available: "There is no vacant Governor's Residence."
 eu5gov_select_governor_to_dismiss: "Select Governor to Dismiss"
 eu5gov_no_governor_to_dismiss: "There is no serving Governor to dismiss."

 EU5GOV_OUTLINER_CATEGORY: "Governors"
 EU5GOV_OUTLINER_HINT: "Right-click to manage"
 EU5GOV_OUTLINER_HEADER_TT: "Manage your [eu5gov_governor|e] offices. Every owned Governor's Residence is listed, including vacant residences. The counter shows serving Governors / total Residences. Click the header to collapse or expand the list."
 EU5GOV_OUTLINER_COUNT_TT: "Serving Governors / Governor's Residences"
 EU5GOV_OUTLINER_RIGHT_CLICK: "Manage Governor"
 EU5GOV_OUTLINER_RIGHT_CLICK_DESC: "Change this [eu5gov_governor|e] role or dismiss the office holder."
 EU5GOV_OUTLINER_EXPAND_MARK: "+"
 EU5GOV_OUTLINER_COLLAPSE_MARK: "−"
 EU5GOV_OPEN_RESIDENCE: "Open Governor's Residence"
 EU5GOV_EMPTY_SLOT: "Empty Governor Slot"
 EU5GOV_EMPTY_SLOT_STATUS: "Vacant"
 EU5GOV_EMPTY_SLOT_TT: "This Governor's Residence has no [eu5gov_governor|e]. Click the empty portrait to choose an eligible character. The Residence itself supplies #G 30#! Proximity Source; an appointed Governor adds #G ADM × 0.50#!."
 EU5GOV_OCCUPIED_SLOT_TT: "This [eu5gov_governor|e] administers the Governor's Residence. The Residence supplies #G 30#! Proximity Source and the Governor adds #G ADM × 0.50#!. Click the portrait to replace them; right-click for role and dismissal options."
 EU5GOV_PORTRAIT_APPOINT_TT: "Appoint Governor"
 EU5GOV_PORTRAIT_APPOINT_DESC: "Choose an eligible character for this Governor's Residence. Eligibility mirrors the country's Cabinet legal restrictions, including gender and Estate access."
 EU5GOV_PORTRAIT_CHANGE_TT: "Change Governor"
 EU5GOV_PORTRAIT_CHANGE_DESC: "Left-click: choose a replacement. Right-click: dismiss the Governor directly. Replacing a non-Crown Governor pays the same Entrenchment-scaled political cost as dismissal."
 EU5GOV_ENTRENCHMENT_SHORT: "Entrenchment:"
 eu5gov_set_role_normal_from_outliner: "Provincial Governor"
 eu5gov_set_role_normal_from_outliner_desc: "Change to [eu5gov_provincial_governor|e]. Cost: #R 20 Stability#!."
 eu5gov_set_role_integration_from_outliner: "Integration Governor"
 eu5gov_set_role_integration_from_outliner_desc: "Change to [eu5gov_integration_governor_role|e]. Cost: #R 20 Stability#!."
 eu5gov_set_role_colonial_from_outliner: "Colonial Governor"
 eu5gov_set_role_colonial_from_outliner_desc: "Change to [eu5gov_colonial_governor_role|e]. Cost: #R 20 Stability#!."
 eu5gov_dismiss_governor_from_outliner: "Dismiss Governor"
 eu5gov_dismiss_governor_from_outliner_desc: "Dismiss the serving Governor. Political cost depends on their [eu5gov_entrenchment|e]."
 EU5GOV_ROLE_INTEGRATION_REQUIREMENT: "The Governor seat must have a different dominant culture from its owner."
 EU5GOV_ROLE_COLONIAL_REQUIREMENT: "The Governor seat must be overseas for its owner."

 EU5GOV_CONTEXT_TITLE: "Governor Role"
 EU5GOV_ROLE_NORMAL: "Normal Governor"
 EU5GOV_ROLE_NORMAL_TT: "[eu5gov_provincial_governor|E]: general provincial administration with no additional specialist modifier. The Governor retains the base #G ADM × 0.50#! Proximity contribution on top of the Residence's #G 30#!. Changing role costs #R 20 Stability#!. The active role cannot be selected again."
 EU5GOV_ROLE_INTEGRATION: "Integration Governor"
 EU5GOV_ROLE_INTEGRATION_TT: "[eu5gov_integration_governor_role|E]: available when the Governor seat has a different dominant culture from its owner. Grants #G +25% local assimilation speed#! at the seat in addition to the normal ADM-based Proximity contribution. Changing role costs #R 20 Stability#!."
 EU5GOV_ROLE_COLONIAL: "Colonial Governor"
 EU5GOV_ROLE_COLONIAL_TT: "[eu5gov_colonial_governor_role|E]: available only at overseas Governor seats. Grants #G +0.25 local migration attraction#! and #G +0.001 local population growth#! at the seat in addition to the normal ADM-based Proximity contribution. Changing role costs #R 20 Stability#!."
 EU5GOV_DISMISS: "Dismiss Governor"
 EU5GOV_DISMISS_TT: "Dismiss this [eu5gov_governor|e]. Non-Crown Governors cost at least #R -10 Estate Satisfaction#! and #R -5 Stability#!. From 10 [eu5gov_entrenchment|e] upward the price scales linearly to #R -100 Satisfaction#! and #R -50 Stability#! at 100. Crown Governors are free."
 EU5GOV_ENTRENCHMENT_TT: "[eu5gov_entrenchment|E] rises yearly by #Y 2 + (ADM + DIP + MIL) / 100#!, up to 100. A Governor increases the power of their Estate by half their Entrenchment: 100 means #Y +50% Estate power#!. It also determines voluntary dismissal/replacement costs for non-Crown Governors, with a permanent 10% minimum floor."


 game_concept_eu5gov_governor: "Governor"
 game_concept_eu5gov_governor_desc: "A [eu5gov_governor|E] is a character appointed to administer a Governor's Residence. The Residence provides #G 30 Proximity Source#!; the Governor adds #G 0.50 Proximity Source per ADM#!, so 100 ADM adds another +50 for a total of 80. Every Governor also has [eu5gov_entrenchment|e] and a Governor role."
 game_concept_eu5gov_provincial_governor: "Provincial Governor"
 game_concept_eu5gov_provincial_governor_desc: "The [eu5gov_provincial_governor|E] is the general administrative role. It has no additional specialist modifier and focuses on the normal ADM-based Proximity contribution of the Governor's Residence."
 game_concept_eu5gov_integration_governor_role: "Integration Governor"
 game_concept_eu5gov_integration_governor_role_desc: "The [eu5gov_integration_governor_role|E] can be assigned at a Governor seat whose dominant culture differs from the owner's culture. It grants #G +25% local assimilation speed#! there in addition to the normal Governor Proximity contribution."
 game_concept_eu5gov_colonial_governor_role: "Colonial Governor"
 game_concept_eu5gov_colonial_governor_role_desc: "The [eu5gov_colonial_governor_role|E] is intended for overseas Governor seats. It grants #G +0.25 local migration attraction#! and #G +0.001 local population growth#! there in addition to the normal Governor Proximity contribution."
 game_concept_eu5gov_entrenchment: "Entrenchment"
 game_concept_eu5gov_entrenchment_desc: "[eu5gov_entrenchment|E] measures a Governor's political and administrative entrenchment from 0 to 100. It rises yearly by #Y 2 + (ADM + DIP + MIL) / 100#!. Each Governor increases their Estate's power by half their Entrenchment. Voluntarily dismissing or replacing a non-Crown Governor uses a minimum cost scale of 10 and otherwise their Entrenchment: the Estate loses that many percentage points of Satisfaction and the country loses half as much Stability. Crown Governors are exempt."
