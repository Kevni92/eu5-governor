l_german:
 local_governor: "Gouverneursresidenz"
 local_governor_desc: "Eine dauerhafte Provinzverwaltung, die die Autorität der Zentralregierung in die Region trägt. Die Residenz gewährt eine grundlegende Nähequelle von #G 30#!. Die Ernennung eines Gouverneurs erhöht diesen Wert zusätzlich, vor allem abhängig von seinen Verwaltungsfähigkeiten."
 naval_governor: "Maritimes Gouverneursamt (veraltet)"
 naval_governor_desc: "Land- und maritime Gouverneursämter werden durch Charakter-Gouverneure vereinheitlicht. Bestehende Kapazität für maritime Gouverneure wird stattdessen für Gouverneursresidenzen verwendet."

 eu5gov_governor_capacity_tt: "Die Zahl der Gouverneursresidenzen muss unter der zusammengefassten Kapazität für #Y lokale Gouverneure#! und #Y maritime Gouverneure#! liegen, abzüglich der Kapazität, die bereits von Statthaltereien genutzt wird."
 eu5gov_governor_administration: "Gouverneursverwaltung"
 eu5gov_governor_administration_desc: "Der ernannte Gouverneur stärkt diesen Ort als Nähequelle. Jeder Punkt @adm![adm|E] gewährt #G +0,50#! Nähequelle. Ein Gouverneur mit 100 ADM ergänzt die Grundnähequelle von 30 damit um #G +50#! auf insgesamt #G 80#!."
 eu5gov_integration_governor: "Integrationsgouverneur"
 eu5gov_integration_governor_desc: "Dieser Gouverneur soll ein kulturell fremdes Gebiet enger an den Staat binden und gewährt #G +25 %#! lokale Assimilationsgeschwindigkeit."
 eu5gov_colonial_governor: "Kolonialgouverneur"
 eu5gov_colonial_governor_desc: "Dieser Gouverneur ist mit der Entwicklung eines überseeischen Besitzes betraut und gewährt #G +0,25#! lokale Migrationsattraktivität und #G +0,001#! lokales Bevölkerungswachstum."

 STATIC_MODIFIER_NAME_eu5gov_governor_administration: "Gouverneursverwaltung"
 STATIC_MODIFIER_DESC_eu5gov_governor_administration: "Der angezeigte Wert #G +1,00#! ist die Basiseinheit des skalierbaren Modifikators. Die tatsächliche Nähequelle entspricht #Y ADM des Gouverneurs × 0,50#!. Beispiel: 55 ADM ergeben #G +27,50#! Nähequelle; zusammen mit den #G +30#! der Gouverneursresidenz sind das #G 57,50#!."
 STATIC_MODIFIER_NAME_eu5gov_integration_governor: "Integrationsverwaltung"
 STATIC_MODIFIER_DESC_eu5gov_integration_governor: "Der Integrationsgouverneur beschleunigt die lokale kulturelle Assimilation."
 STATIC_MODIFIER_NAME_eu5gov_colonial_governor: "Kolonialverwaltung"
 STATIC_MODIFIER_DESC_eu5gov_colonial_governor: "Der Kolonialgouverneur fördert Migration und Bevölkerungswachstum am Gouverneurssitz."
 STATIC_MODIFIER_NAME_eu5gov_governor_crown_estate_power: "Gouverneurseinfluss: Krone"
 STATIC_MODIFIER_NAME_eu5gov_governor_nobles_estate_power: "Gouverneurseinfluss: Adel"
 STATIC_MODIFIER_NAME_eu5gov_governor_clergy_estate_power: "Gouverneurseinfluss: Klerus"
 STATIC_MODIFIER_NAME_eu5gov_governor_burghers_estate_power: "Gouverneurseinfluss: Bürger"
