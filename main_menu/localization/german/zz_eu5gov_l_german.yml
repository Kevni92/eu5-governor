 STATIC_MODIFIER_NAME_eu5gov_governor_tribes_estate_power: "Gouverneurseinfluss: Stämme"
 STATIC_MODIFIER_NAME_eu5gov_governor_cossacks_estate_power: "Gouverneurseinfluss: Kosaken"
 STATIC_MODIFIER_NAME_eu5gov_governor_dhimmi_estate_power: "Gouverneurseinfluss: Dhimmi"

 eu5gov_governor_crown_estate_power: "Gouverneurseinfluss: Krone"
 eu5gov_governor_crown_estate_power_desc: "Amtierende Kron-Gouverneure erhöhen die Macht des Kronstandes um die Hälfte ihrer gemeinsamen Verankerung."
 eu5gov_governor_nobles_estate_power: "Gouverneurseinfluss: Adel"
 eu5gov_governor_nobles_estate_power_desc: "Amtierende Adelsgouverneure erhöhen die Macht des Adels um die Hälfte ihrer gemeinsamen Verankerung."
 eu5gov_governor_clergy_estate_power: "Gouverneurseinfluss: Klerus"
 eu5gov_governor_clergy_estate_power_desc: "Amtierende Klerusgouverneure erhöhen die Macht des Klerus um die Hälfte ihrer gemeinsamen Verankerung."
 eu5gov_governor_burghers_estate_power: "Gouverneurseinfluss: Bürger"
 eu5gov_governor_burghers_estate_power_desc: "Amtierende Bürgergouverneure erhöhen die Macht der Bürger um die Hälfte ihrer gemeinsamen Verankerung."
 eu5gov_governor_peasants_estate_power: "Gouverneurseinfluss: Bauern"
 eu5gov_governor_peasants_estate_power_desc: "Amtierende Bauerngouverneure erhöhen die Macht der Bauern um die Hälfte ihrer gemeinsamen Verankerung."
 eu5gov_governor_tribes_estate_power: "Gouverneurseinfluss: Stämme"
 eu5gov_governor_tribes_estate_power_desc: "Amtierende Stammesgouverneure erhöhen die Macht der Stämme um die Hälfte ihrer gemeinsamen Verankerung."
 eu5gov_governor_cossacks_estate_power: "Gouverneurseinfluss: Kosaken"
 eu5gov_governor_cossacks_estate_power_desc: "Amtierende Kosakengouverneure erhöhen die Macht der Kosaken um die Hälfte ihrer gemeinsamen Verankerung."
 eu5gov_governor_dhimmi_estate_power: "Gouverneurseinfluss: Dhimmi"
 eu5gov_governor_dhimmi_estate_power_desc: "Amtierende Dhimmi-Gouverneure erhöhen die Macht der Dhimmi um die Hälfte ihrer gemeinsamen Verankerung."

 eu5gov_appoint_governor: "Gouverneur ernennen"
 eu5gov_appoint_governor_concept: "Gouverneur"
 eu5gov_appoint_governor_act: "$eu5gov_appoint_governor$"
 eu5gov_appoint_governor_desc_specific: "Ernennt einen geeigneten Charakter zum Leiter einer unbesetzten Gouverneursresidenz."
 eu5gov_appoint_governor_desc: "Wählt einen geeigneten Charakter und eine unbesetzte Gouverneursresidenz. Ein neu ernannter Gouverneur beginnt als Provinzgouverneur. Seine Amtsausrichtung kann anschließend im Gouverneursbereich des Outliners per Rechtsklick geändert werden."
 eu5gov_appoint_governor_past: "Ein Gouverneur wurde ernannt"
 eu5gov_appoint_governor_act_past: "[SCOPE.sCharacter('recipient').GetName] wurde in [SCOPE.sLocation('target').GetName] zum Gouverneur ernannt."

 eu5gov_appoint_governor_at_residence: "Gouverneur ernennen"
 eu5gov_appoint_governor_at_residence_concept: "Gouverneur"
 eu5gov_appoint_governor_at_residence_act: "$eu5gov_appoint_governor_at_residence$"
 eu5gov_appoint_governor_at_residence_desc_specific: "Wählt einen Gouverneur für diese unbesetzte Gouverneursresidenz."
 eu5gov_appoint_governor_at_residence_desc: "Wählt einen geeigneten Charakter für die im Outliner angeklickte Gouverneursresidenz. Die Zulassung folgt den rechtlichen Kabinettsbeschränkungen des Landes, einschließlich Geschlecht und Stand; außerdem darf der Charakter kein anderes wichtiges Amt oder Kommando innehaben."
 eu5gov_appoint_governor_at_residence_past: "Ein Gouverneur wurde ernannt"
 eu5gov_appoint_governor_at_residence_act_past: "[SCOPE.sCharacter('recipient').GetName] wurde zum Gouverneur ernannt."

 eu5gov_change_governor_at_residence: "Gouverneur ersetzen"
 eu5gov_change_governor_at_residence_concept: "Gouverneur"
 eu5gov_change_governor_at_residence_act: "$eu5gov_change_governor_at_residence$"
 eu5gov_change_governor_at_residence_desc_specific: "Ersetzt den derzeitigen Gouverneur dieser Gouverneursresidenz."
 eu5gov_change_governor_at_residence_desc: "Wählt einen neuen geeigneten Gouverneur. Das Ersetzen des bisherigen Amtsinhabers zählt als freiwillige Entlassung und verursacht daher dessen nach Verankerung skalierende politische Kosten, sofern er nicht dem Kronstand angehört."
 eu5gov_change_governor_at_residence_past: "Ein Gouverneur wurde ersetzt"
 eu5gov_change_governor_at_residence_act_past: "[SCOPE.sCharacter('recipient').GetName] wurde neuer Gouverneur."

 eu5gov_appoint_governor_from_outliner: "Gouverneur ernennen"
 eu5gov_appoint_governor_from_outliner_desc: "Wählt einen geeigneten Charakter für diese Gouverneursresidenz."
 eu5gov_change_governor_from_outliner: "Gouverneur ersetzen"
 eu5gov_change_governor_from_outliner_desc: "Wählt einen neuen geeigneten Gouverneur. Das Ersetzen eines Nicht-Kron-Gouverneurs verursacht dieselben nach Verankerung skalierenden politischen Kosten wie eine Entlassung."

 eu5gov_dismiss_governor: "Gouverneur entlassen"
 eu5gov_dismiss_governor_concept: "Gouverneur"
 eu5gov_dismiss_governor_act: "$eu5gov_dismiss_governor$"
 eu5gov_dismiss_governor_desc_specific: "Entlasst einen ernannten Gouverneur und lasst die Residenz unbesetzt."
 eu5gov_dismiss_governor_desc: "Entfernt einen Gouverneur aus seinem Amt. Bei Nicht-Kron-Gouverneuren betragen die politischen Kosten mindestens #R -10 Standeszufriedenheit#! und #R -5 Stabilität#!. Oberhalb von 10 Verankerung skalieren sie linear: 50 Verankerung kosten -50 Zufriedenheit und -25 Stabilität; 100 Verankerung kosten -100 Zufriedenheit und -50 Stabilität. Kron-Gouverneure können kostenlos entlassen werden."
 eu5gov_dismiss_governor_past: "Ein Gouverneur wurde entlassen"
 eu5gov_dismiss_governor_act_past: "[SCOPE.sCharacter('recipient').GetName] wurde aus dem Gouverneursamt entlassen."

 eu5gov_select_governor_character: "Gouverneur auswählen"
 eu5gov_select_replacement_governor: "Neuen Gouverneur auswählen"
 eu5gov_no_governor_character_available: "Es ist kein geeigneter Charakter verfügbar. Kandidaten unterliegen den rechtlichen Kabinettsbeschränkungen des Landes für Geschlecht und Stand, müssen volljährig und loyal sein und dürfen kein anderes wichtiges Amt, Militärkommando, Explorationsauftrag oder Gouverneursamt innehaben."
 eu5gov_select_governor_residence: "Gouverneursresidenz auswählen"
 eu5gov_no_governor_residence_available: "Es gibt keine unbesetzte Gouverneursresidenz."
 eu5gov_select_governor_to_dismiss: "Zu entlassenden Gouverneur auswählen"
 eu5gov_no_governor_to_dismiss: "Es gibt keinen amtierenden Gouverneur, der entlassen werden kann."

 EU5GOV_OUTLINER_CATEGORY: "Gouverneure"
 EU5GOV_OUTLINER_HINT: "Rechtsklick zum Verwalten"
 EU5GOV_OUTLINER_HEADER_TT: "Verwaltet Eure [eu5gov_governor|e]. Aufgeführt werden alle eigenen Gouverneursresidenzen, einschließlich unbesetzter Ämter. Der Zähler zeigt amtierende Gouverneure / gesamte Gouverneursresidenzen. Klickt auf die Überschrift, um die Liste ein- oder auszuklappen."
 EU5GOV_OUTLINER_COUNT_TT: "Amtierende Gouverneure / Gouverneursresidenzen"
 EU5GOV_OUTLINER_RIGHT_CLICK: "Gouverneur verwalten"
 EU5GOV_OUTLINER_RIGHT_CLICK_DESC: "Ändert die Amtsausrichtung dieses [eu5gov_governor|e] oder entlasst ihn."
 EU5GOV_OUTLINER_EXPAND_MARK: "+"
 EU5GOV_OUTLINER_COLLAPSE_MARK: "−"
 EU5GOV_OPEN_RESIDENCE: "Gouverneursresidenz öffnen"
 EU5GOV_EMPTY_SLOT: "Unbesetzter Gouverneursposten"
 EU5GOV_EMPTY_SLOT_STATUS: "Unbesetzt"
 EU5GOV_EMPTY_SLOT_TT: "Diese Gouverneursresidenz hat keinen [eu5gov_governor|e]. Klickt auf das leere Porträt, um einen geeigneten Charakter auszuwählen. Die Residenz selbst liefert #G 30#! Nähequelle; ein Gouverneur ergänzt #G ADM × 0,50#!."
 EU5GOV_OCCUPIED_SLOT_TT: "Dieser [eu5gov_governor|e] verwaltet die Gouverneursresidenz. Die Residenz liefert #G 30#! Nähequelle und der Gouverneur zusätzlich #G ADM × 0,50#!. Klickt auf das Porträt zum Ersetzen; Rechtsklick öffnet Amtsausrichtung und Entlassung."
 EU5GOV_PORTRAIT_APPOINT_TT: "Gouverneur ernennen"
 EU5GOV_PORTRAIT_APPOINT_DESC: "Wählt einen geeigneten Charakter für diese Gouverneursresidenz. Die Zulassung folgt den rechtlichen Kabinettsbeschränkungen des Landes, einschließlich Geschlecht und Stand."
 EU5GOV_PORTRAIT_CHANGE_TT: "Gouverneur ersetzen"
 EU5GOV_PORTRAIT_CHANGE_DESC: "Linksklick: Nachfolger wählen. Rechtsklick: Gouverneur direkt entlassen. Das Ersetzen eines Nicht-Kron-Gouverneurs verursacht dieselben nach Verankerung skalierenden politischen Kosten wie eine Entlassung."
 EU5GOV_ENTRENCHMENT_SHORT: "Verankerung:"
 eu5gov_set_role_normal_from_outliner: "Provinzgouverneur"
 eu5gov_set_role_normal_from_outliner_desc: "Wechselt zu [eu5gov_provincial_governor|e]. Kosten: #R 20 Stabilität#!."
 eu5gov_set_role_integration_from_outliner: "Integrationsgouverneur"
 eu5gov_set_role_integration_from_outliner_desc: "Wechselt zu [eu5gov_integration_governor_role|e]. Kosten: #R 20 Stabilität#!."
 eu5gov_set_role_colonial_from_outliner: "Kolonialgouverneur"
 eu5gov_set_role_colonial_from_outliner_desc: "Wechselt zu [eu5gov_colonial_governor_role|e]. Kosten: #R 20 Stabilität#!."
 eu5gov_dismiss_governor_from_outliner: "Gouverneur entlassen"
 eu5gov_dismiss_governor_from_outliner_desc: "Entlässt den amtierenden Gouverneur. Die politischen Kosten richten sich nach seiner [eu5gov_entrenchment|e]."
 EU5GOV_ROLE_INTEGRATION_REQUIREMENT: "Die vorherrschende Kultur des Gouverneurssitzes muss von der Kultur des Besitzers abweichen."
 EU5GOV_ROLE_COLONIAL_REQUIREMENT: "Der Gouverneurssitz muss für seinen Besitzer überseeisch sein."

 EU5GOV_CONTEXT_TITLE: "Amtsausrichtung"
 EU5GOV_ROLE_NORMAL: "Provinzgouverneur"
 EU5GOV_ROLE_NORMAL_TT: "[eu5gov_provincial_governor|E]: allgemeine Provinzverwaltung ohne zusätzlichen Spezialmodifikator. Der Gouverneur behält den Grundeffekt von #G ADM × 0,50#! Nähequelle zusätzlich zu den #G 30#! der Residenz. Ein Wechsel der Amtsausrichtung kostet #R 20 Stabilität#!. Die bereits aktive Amtsausrichtung kann nicht erneut gewählt werden."
 EU5GOV_ROLE_INTEGRATION: "Integrationsgouverneur"
 EU5GOV_ROLE_INTEGRATION_TT: "[eu5gov_integration_governor_role|E]: verfügbar, wenn die vorherrschende Kultur des Gouverneurssitzes von der Kultur des Besitzers abweicht. Gewährt am Sitz #G +25 % lokale Assimilationsgeschwindigkeit#! und behält den normalen ADM-basierten Nähebonus. Ein Wechsel der Amtsausrichtung kostet #R 20 Stabilität#!."
 EU5GOV_ROLE_COLONIAL: "Kolonialgouverneur"
 EU5GOV_ROLE_COLONIAL_TT: "[eu5gov_colonial_governor_role|E]: nur in überseeischen Gebieten verfügbar. Gewährt am Sitz #G +0,25 lokale Migrationsattraktivität#! und #G +0,001 lokales Bevölkerungswachstum#! zusätzlich zum normalen ADM-basierten Nähebonus. Die bereits aktive Amtsausrichtung kann nicht erneut gewählt werden."
 EU5GOV_DISMISS: "Gouverneur entlassen"
 EU5GOV_DISMISS_TT: "Entlasst diesen [eu5gov_governor|e]. Nicht-Kron-Gouverneure kosten mindestens #R -10 Standeszufriedenheit#! und #R -5 Stabilität#!. Ab 10 [eu5gov_entrenchment|e] skaliert der Preis linear bis #R -100 Zufriedenheit#! und #R -50 Stabilität#! bei 100. Kron-Gouverneure sind kostenlos."
 EU5GOV_ENTRENCHMENT_TT: "[eu5gov_entrenchment|E] steigt jährlich um #Y 2 + (ADM + DIP + MIL) / 100#! bis maximal 100. Ein Gouverneur erhöht die Macht seines Standes um die Hälfte seiner Verankerung: 100 bedeuten #Y +50 % Standesmacht#!. Bei Nicht-Kron-Gouverneuren bestimmt sie außerdem die Entlassungskosten; diese haben immer mindestens den 10-%-Sockel."
 EU5GOV_CHARACTER_ROLE_GOVERNOR: "Gouverneur"
 EU5GOV_CHARACTER_ROLE_GOVERNOR_TT: "Dieser Charakter übt ein Gouverneursamt aus."


 game_concept_eu5gov_governor: "Gouverneur"
 game_concept_eu5gov_governor_desc: "Ein [eu5gov_governor|E] ist ein Charakter, der eine Gouverneursresidenz verwaltet. Die Residenz stellt #G 30 Nähequelle#! bereit; der Gouverneur ergänzt #G 0,50 Nähequelle je ADM#!, sodass 100 ADM weitere +50 und insgesamt 80 ergeben. Jeder Gouverneur besitzt außerdem [eu5gov_entrenchment|e] und eine Amtsausrichtung."
 game_concept_eu5gov_provincial_governor: "Provinzgouverneur"
 game_concept_eu5gov_provincial_governor_desc: "Der [eu5gov_provincial_governor|E] ist die allgemeine Verwaltungsrolle. Er besitzt keinen zusätzlichen Spezialmodifikator und konzentriert sich auf den normalen ADM-basierten Nähebonus der Gouverneursresidenz."
 game_concept_eu5gov_integration_governor_role: "Integrationsgouverneur"
 game_concept_eu5gov_integration_governor_role_desc: "Der [eu5gov_integration_governor_role|E] kann an einem Gouverneurssitz mit fremder vorherrschender Kultur eingesetzt werden. Er gewährt dort #G +25 % lokale Assimilationsgeschwindigkeit#! zusätzlich zum normalen Gouverneurs-Nähebonus."
 game_concept_eu5gov_colonial_governor_role: "Kolonialgouverneur"
 game_concept_eu5gov_colonial_governor_role_desc: "Der [eu5gov_colonial_governor_role|E] ist für überseeische Gouverneurssitze bestimmt. Er gewährt dort #G +0,25 lokale Migrationsattraktivität#! und #G +0,001 lokales Bevölkerungswachstum#! zusätzlich zum normalen Gouverneurs-Nähebonus."
 game_concept_eu5gov_entrenchment: "Verankerung"
 game_concept_eu5gov_entrenchment_desc: "[eu5gov_entrenchment|E] misst die politische und administrative Verfestigung eines Gouverneurs von 0 bis 100. Sie steigt jährlich um #Y 2 + (ADM + DIP + MIL) / 100#!. Jeder Gouverneur erhöht die Macht seines Standes um die Hälfte seiner Verankerung. Bei einer freiwilligen Entlassung oder Ersetzung eines Nicht-Kron-Gouverneurs gilt als Kostenwert mindestens 10 und ansonsten seine Verankerung: daraus entstehen gleich viele negative Prozentpunkte Standeszufriedenheit und halb so viel negative Stabilität. Kron-Gouverneure sind davon ausgenommen."
