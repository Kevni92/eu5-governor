l_german:
 local_governor: "Gouverneursresidenz"
 local_governor_desc: "Eine dauerhafte Provinzverwaltung, die die Autorität der Zentralregierung in die Region trägt. Die Residenz gewährt eine grundlegende Nähequelle von #G 50#!. Die Ernennung eines Gouverneurs erhöht diesen Wert zusätzlich, vor allem abhängig von seinen Verwaltungsfähigkeiten."
 naval_governor: "Maritimes Gouverneursamt (veraltet)"
 naval_governor_desc: "Land- und maritime Gouverneursämter werden durch Charakter-Gouverneure vereinheitlicht. Bestehende Kapazität für maritime Gouverneure wird stattdessen für Gouverneursresidenzen verwendet."

 eu5gov_governor_capacity_tt: "Die Zahl der Gouverneursresidenzen muss unter der zusammengefassten Kapazität für #Y lokale Gouverneure#! und #Y maritime Gouverneure#! liegen, abzüglich der Kapazität, die bereits von Statthaltereien genutzt wird."
 eu5gov_governor_administration: "Gouverneursverwaltung"
 eu5gov_governor_administration_desc: "Der ernannte Gouverneur stärkt diesen Ort als Nähequelle. Jeder Punkt @adm![adm|E] gewährt #G +0,25#! Nähequelle; jeder Punkt @dip![dip|E] und @mil![mil|E] gewährt #G +0,05#!."
 eu5gov_integration_governor: "Integrationsgouverneur"
 eu5gov_integration_governor_desc: "Dieser Gouverneur soll ein kulturell fremdes Gebiet enger an den Staat binden und gewährt #G +25 %#! lokale Assimilationsgeschwindigkeit."
 eu5gov_colonial_governor: "Kolonialgouverneur"
 eu5gov_colonial_governor_desc: "Dieser Gouverneur ist mit der Entwicklung eines überseeischen Besitzes betraut und gewährt #G +0,25#! lokale Migrationsattraktivität."

 eu5gov_appoint_governor: "Gouverneur ernennen"
 eu5gov_appoint_governor_concept: "Gouverneur"
 eu5gov_appoint_governor_act: "$eu5gov_appoint_governor$"
 eu5gov_appoint_governor_desc_specific: "Ernennt einen geeigneten Charakter zum Leiter einer unbesetzten Gouverneursresidenz."
 eu5gov_appoint_governor_desc: "Wählt einen geeigneten Charakter und eine unbesetzte Gouverneursresidenz. Ein neu ernannter Gouverneur beginnt als Provinzgouverneur. Seine Amtsausrichtung kann anschließend im Gouverneursbereich des Outliners per Rechtsklick geändert werden."
 eu5gov_appoint_governor_past: "Ein Gouverneur wurde ernannt"
 eu5gov_appoint_governor_act_past: "[SCOPE.sCharacter('recipient').GetName] wurde in [SCOPE.sLocation('target').GetName] zum Gouverneur ernannt."

 eu5gov_appoint_governor_at_residence: "Gouverneur ernennen"
 eu5gov_appoint_governor_at_residence_concept: "Gouverneur"
 eu5gov_appoint_governor_at_residence_act: "$eu5gov_appoint_governor_at_residence$"
 eu5gov_appoint_governor_at_residence_desc_specific: "Wählt einen Gouverneur für diese unbesetzte Gouverneursresidenz."
 eu5gov_appoint_governor_at_residence_desc: "Wählt einen geeigneten Charakter für die im Outliner angeklickte Gouverneursresidenz. Die Zulassung folgt den rechtlichen Kabinettsbeschränkungen des Landes, einschließlich Geschlecht und Stand; außerdem darf der Charakter kein anderes wichtiges Amt oder Kommando innehaben."
 eu5gov_appoint_governor_at_residence_past: "Ein Gouverneur wurde ernannt"
 eu5gov_appoint_governor_at_residence_act_past: "[SCOPE.sCharacter('recipient').GetName] wurde zum Gouverneur ernannt."

 eu5gov_change_governor_at_residence: "Gouverneur ersetzen"
 eu5gov_change_governor_at_residence_concept: "Gouverneur"
 eu5gov_change_governor_at_residence_act: "$eu5gov_change_governor_at_residence$"
 eu5gov_change_governor_at_residence_desc_specific: "Ersetzt den derzeitigen Gouverneur dieser Gouverneursresidenz."
 eu5gov_change_governor_at_residence_desc: "Wählt einen neuen geeigneten Gouverneur für den im Outliner angeklickten Posten. Der bisherige Gouverneur wird aus dem Amt entlassen; sein Nachfolger beginnt als Provinzgouverneur mit einer Machtbasis von 0."
 eu5gov_change_governor_at_residence_past: "Ein Gouverneur wurde ersetzt"
 eu5gov_change_governor_at_residence_act_past: "[SCOPE.sCharacter('recipient').GetName] wurde neuer Gouverneur."

 eu5gov_appoint_governor_from_outliner: "Gouverneur ernennen"
 eu5gov_appoint_governor_from_outliner_desc: "Wählt einen geeigneten Charakter für diese Gouverneursresidenz."
 eu5gov_change_governor_from_outliner: "Gouverneur ersetzen"
 eu5gov_change_governor_from_outliner_desc: "Wählt einen neuen geeigneten Gouverneur für diese Gouverneursresidenz."

 eu5gov_dismiss_governor: "Gouverneur entlassen"
 eu5gov_dismiss_governor_concept: "Gouverneur"
 eu5gov_dismiss_governor_act: "$eu5gov_dismiss_governor$"
 eu5gov_dismiss_governor_desc_specific: "Entlasst einen ernannten Gouverneur und lasst die Residenz unbesetzt."
 eu5gov_dismiss_governor_desc: "Entfernt einen Gouverneur aus seinem Amt. Der Charakter steht anschließend wieder für andere Aufgaben zur Verfügung und der Ort verliert den charakterabhängigen Nähebons. Die Gouverneursresidenz bleibt als unbesetzter Posten im Outliner sichtbar."
 eu5gov_dismiss_governor_past: "Ein Gouverneur wurde entlassen"
 eu5gov_dismiss_governor_act_past: "[SCOPE.sCharacter('recipient').GetName] wurde aus dem Gouverneursamt entlassen."

 eu5gov_select_governor_character: "Gouverneur auswählen"
 eu5gov_select_replacement_governor: "Neuen Gouverneur auswählen"
 eu5gov_no_governor_character_available: "Es ist kein geeigneter Charakter verfügbar. Kandidaten unterliegen den rechtlichen Kabinettsbeschränkungen des Landes für Geschlecht und Stand, müssen volljährig und loyal sein und dürfen kein anderes wichtiges Amt, Militärkommando, Explorationsauftrag oder Gouverneursamt innehaben."
 eu5gov_select_governor_residence: "Gouverneursresidenz auswählen"
 eu5gov_no_governor_residence_available: "Es gibt keine unbesetzte Gouverneursresidenz."
 eu5gov_select_governor_to_dismiss: "Zu entlassenden Gouverneur auswählen"
 eu5gov_no_governor_to_dismiss: "Es gibt keinen amtierenden Gouverneur, der entlassen werden kann."

 EU5GOV_OUTLINER_CATEGORY: "Gouverneure"
 EU5GOV_OUTLINER_HINT: "Rechtsklick zum Verwalten"
 EU5GOV_OUTLINER_HEADER_TT: "Gouverneursposten. Aufgeführt werden alle eigenen Gouverneursresidenzen, einschließlich unbesetzter Ämter. Der Zähler zeigt amtierende Gouverneure / gesamte Gouverneursresidenzen. Klickt auf die Überschrift, um die Liste ein- oder auszuklappen."
 EU5GOV_OUTLINER_COUNT_TT: "Amtierende Gouverneure / Gouverneursresidenzen"
 EU5GOV_OUTLINER_RIGHT_CLICK: "Gouverneur verwalten"
 EU5GOV_OUTLINER_EXPAND_MARK: "+"
 EU5GOV_OUTLINER_COLLAPSE_MARK: "−"
 EU5GOV_OPEN_RESIDENCE: "Gouverneursresidenz öffnen"
 EU5GOV_EMPTY_SLOT: "Unbesetzter Gouverneursposten"
 EU5GOV_EMPTY_SLOT_STATUS: "Unbesetzt"
 EU5GOV_EMPTY_SLOT_TT: "Diese Gouverneursresidenz hat keinen Gouverneur. Klickt auf das leere Porträt, um einen geeigneten Gouverneur auszuwählen. Ein Klick auf den restlichen Eintrag öffnet den Ort."
 EU5GOV_OCCUPIED_SLOT_TT: "Diese Gouverneursresidenz ist besetzt. Klickt auf das Porträt, um den Gouverneur zu ersetzen; ein Klick auf den restlichen Eintrag öffnet den Ort; per Rechtsklick könnt Ihr Amtsausrichtung oder Entlassung verwalten."
 EU5GOV_PORTRAIT_APPOINT_TT: "Gouverneur ernennen"
 EU5GOV_PORTRAIT_APPOINT_DESC: "Wählt einen geeigneten Charakter für diese Gouverneursresidenz. Die Zulassung folgt den rechtlichen Kabinettsbeschränkungen des Landes, einschließlich Geschlecht und Stand."
 EU5GOV_PORTRAIT_CHANGE_TT: "Gouverneur ersetzen"
 EU5GOV_PORTRAIT_CHANGE_DESC: "Wählt einen Nachfolger für diese Gouverneursresidenz. Der neue Gouverneur beginnt mit einer Machtbasis von 0."
 EU5GOV_ENTRENCHMENT_SHORT: "Machtbasis:"
 EU5GOV_CONTEXT_TITLE: "Amtsausrichtung"
 EU5GOV_ROLE_NORMAL: "Provinzgouverneur"
 EU5GOV_ROLE_NORMAL_TT: "Überträgt die allgemeine Provinzverwaltung. Dies ist die Standardausrichtung für Kern- und Heimatgebiete."
 EU5GOV_ROLE_INTEGRATION: "Integrationsgouverneur"
 EU5GOV_ROLE_INTEGRATION_TT: "Überträgt die Integrationsverwaltung. Sie ist verfügbar, wenn die vorherrschende Kultur des Gouverneurssitzes von der Kultur des Besitzers abweicht, und gewährt #G +25 %#! lokale Assimilationsgeschwindigkeit."
 EU5GOV_ROLE_COLONIAL: "Kolonialgouverneur"
 EU5GOV_ROLE_COLONIAL_TT: "Überträgt die Kolonialverwaltung. Sie ist nur in überseeischen Gebieten verfügbar und gewährt #G +0,25#! lokale Migrationsattraktivität."
 EU5GOV_DISMISS: "Gouverneur entlassen"
 EU5GOV_DISMISS_TT: "Entlasst diesen Charakter aus dem Gouverneursamt und lasst die Gouverneursresidenz unbesetzt. Der Posten bleibt im Outliner sichtbar."
 EU5GOV_ENTRENCHMENT_TT: "Die Machtbasis beschreibt, wie fest der Gouverneur ein persönliches Verwaltungsnetzwerk in seinem Amt aufgebaut hat. Sie steigt einmal jährlich um #Y 2 + (ADM + DIP + MIL) / 100#! bis maximal 100. Derzeit hat die Machtbasis noch keine direkten Spielauswirkungen; diese folgen in einem späteren Balancing-Schritt."
 EU5GOV_CHARACTER_ROLE_GOVERNOR: "Gouverneur"
 EU5GOV_CHARACTER_ROLE_GOVERNOR_TT: "Dieser Charakter übt ein Gouverneursamt aus."
